enable
configure terminal
hostname ISP2-R
no ip domain-lookup
ip domain-name dc1.lab
service password-encryption
enable secret DcLabOnly2026!
username netadmin privilege 15 secret DcLabOnly2026!
banner motd #AUTHORIZED SIMULATOR LAB ONLY#
crypto key generate rsa general-keys modulus 1024
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 2
ip access-list standard MGMT-SSH
permit 10.10.10.0 0.0.0.255
deny any
exit
line console 0
logging synchronous
exec-timeout 15 0
login local
exit
line vty 0 4
login local
transport input ssh
access-class MGMT-SSH in
exec-timeout 10 0
exit
interface GigabitEthernet0/0
description INET-R
ip address 100.64.0.6 255.255.255.252
no shutdown
exit
interface GigabitEthernet0/1
description EDGE-R1
ip address 100.64.2.1 255.255.255.252
no shutdown
exit
router bgp 64502
bgp log-neighbor-changes
neighbor 100.64.0.5 remote-as 64500
neighbor 100.64.2.2 remote-as 65010
exit
end
write memory
