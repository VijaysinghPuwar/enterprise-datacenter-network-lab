enable
configure terminal
hostname CORE-2
no ip domain-lookup
ip domain-name dc1.lab
service password-encryption
enable secret DcLabOnly2026!
username netadmin privilege 15 secret DcLabOnly2026!
banner motd #AUTHORIZED SIMULATOR LAB ONLY#
crypto key generate rsa general-keys modulus 1024
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 2
ip access-list standard MGMT-SSH
permit 10.10.10.0 0.0.0.255
deny any
exit
line console 0
logging synchronous
exec-timeout 15 0
login local
exit
line vty 0 4
login local
transport input ssh
access-class MGMT-SSH in
exec-timeout 10 0
exit
service timestamps log datetime msec
logging 10.10.50.20
logging trap debugging
ntp server 10.10.50.20
ip routing
vlan 10
name MGMT
exit
vlan 20
name WEB
exit
vlan 30
name APP
exit
vlan 40
name DB
exit
vlan 50
name SERVICES
exit
vlan 99
name NATIVE-UNUSED
exit
vlan 900
name FW-TRANSIT
exit
vlan 999
name BLACKHOLE
exit
vtp mode transparent
spanning-tree mode rapid-pvst
interface Vlan10
description MGMT
ip address 10.10.10.3 255.255.255.0
standby version 2
standby 10 ip 10.10.10.1
standby 10 priority 100
standby 10 preempt
standby 10 timers 1 3
no shutdown
ip ospf cost 100
ip helper-address 10.10.50.10
exit
spanning-tree vlan 10 priority 8192
interface Vlan20
description WEB
ip address 10.10.20.3 255.255.255.0
standby version 2
standby 20 ip 10.10.20.1
standby 20 priority 110
standby 20 preempt
standby 20 timers 1 3
no shutdown
ip ospf cost 100
exit
spanning-tree vlan 20 priority 4096
interface Vlan30
description APP
ip address 10.10.30.3 255.255.255.0
standby version 2
standby 30 ip 10.10.30.1
standby 30 priority 100
standby 30 preempt
standby 30 timers 1 3
no shutdown
ip ospf cost 100
exit
spanning-tree vlan 30 priority 8192
interface Vlan50
description SERVICES
ip address 10.10.50.3 255.255.255.0
standby version 2
standby 50 ip 10.10.50.1
standby 50 priority 100
standby 50 preempt
standby 50 timers 1 3
no shutdown
ip ospf cost 100
exit
spanning-tree vlan 50 priority 8192
interface Vlan900
description FW-TRANSIT
ip address 10.255.0.3 255.255.255.248
standby version 2
standby 900 ip 10.255.0.1
standby 900 priority 100
standby 900 preempt
standby 900 timers 1 3
no shutdown
no ip proxy-arp
ip ospf hello-interval 1
ip ospf dead-interval 3
exit
spanning-tree vlan 900 priority 8192
spanning-tree vlan 40 priority 4096
interface FastEthernet0/1
switchport trunk encapsulation dot1q
switchport mode trunk
switchport trunk native vlan 99
switchport trunk allowed vlan 10,20,30,40,50,99,900
switchport nonegotiate
no shutdown
exit
