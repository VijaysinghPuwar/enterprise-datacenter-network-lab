enable
configure terminal
hostname EDGE-R1
no ip domain-lookup
ip domain-name dc1.lab
service password-encryption
enable secret DcLabOnly2026!
username netadmin privilege 15 secret DcLabOnly2026!
banner motd #AUTHORIZED SIMULATOR LAB ONLY#
crypto key generate rsa general-keys modulus 1024
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 2
ip access-list standard MGMT-SSH
permit 10.10.10.0 0.0.0.255
deny any
exit
line console 0
logging synchronous
exec-timeout 15 0
login local
exit
line vty 0 4
login local
transport input ssh
access-class MGMT-SSH in
exec-timeout 10 0
exit
interface GigabitEthernet0/0/0
description ISP1-R
ip address 100.64.1.2 255.255.255.252
no shutdown
exit
interface GigabitEthernet0/0/1
description ISP2-R
ip address 100.64.2.2 255.255.255.252
no shutdown
exit
interface GigabitEthernet0/0/2
description FW-1-OUTSIDE
ip address 198.51.100.1 255.255.255.248
no shutdown
exit
ip route 198.51.100.0 255.255.255.0 198.51.100.2
ip route 0.0.0.0 0.0.0.0 100.64.1.1
ip route 0.0.0.0 0.0.0.0 100.64.2.1 250
router bgp 65010
bgp log-neighbor-changes
neighbor 100.64.1.1 remote-as 64501
neighbor 100.64.2.1 remote-as 64502
network 198.51.100.0 mask 255.255.255.0
exit
end
write memory
