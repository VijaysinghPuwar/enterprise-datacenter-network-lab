enable
configure terminal
hostname ACC-1
no ip domain-lookup
ip domain-name dc1.lab
service password-encryption
enable secret DcLabOnly2026!
username netadmin privilege 15 secret DcLabOnly2026!
banner motd #AUTHORIZED SIMULATOR LAB ONLY#
crypto key generate rsa general-keys modulus 1024
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 2
ip access-list standard MGMT-SSH
permit 10.10.10.0 0.0.0.255
deny any
exit
line console 0
logging synchronous
exec-timeout 15 0
login local
exit
line vty 0 4
login local
transport input ssh
access-class MGMT-SSH in
exec-timeout 10 0
exit
service timestamps log datetime msec
logging 10.10.50.20
logging trap debugging
ntp server 10.10.50.20
vlan 10
name MGMT
exit
vlan 20
name WEB
exit
vlan 30
name APP
exit
vlan 40
name DB
exit
vlan 50
name SERVICES
exit
vlan 99
name NATIVE-UNUSED
exit
vlan 900
name FW-TRANSIT
exit
vlan 999
name BLACKHOLE
exit
vtp mode transparent
spanning-tree mode rapid-pvst
interface Vlan10
ip address 10.10.10.11 255.255.255.0
no shutdown
exit
ip default-gateway 10.10.10.1
ip dhcp snooping
ip dhcp snooping vlan 10
no ip dhcp snooping information option
interface GigabitEthernet0/1
switchport mode trunk
switchport trunk native vlan 99
switchport trunk allowed vlan 10,20,30,40,50,99,900
switchport nonegotiate
no shutdown
exit
interface GigabitEthernet0/1
ip dhcp snooping trust
exit
interface GigabitEthernet0/2
switchport mode trunk
switchport trunk native vlan 99
switchport trunk allowed vlan 10,20,30,40,50,99,900
switchport nonegotiate
no shutdown
exit
interface GigabitEthernet0/2
ip dhcp snooping trust
exit
interface FastEthernet0/1
description WEB-01
switchport mode access
switchport access vlan 20
spanning-tree portfast
spanning-tree bpduguard enable
switchport port-security
switchport port-security maximum 2
switchport port-security mac-address sticky
switchport port-security violation restrict
no shutdown
exit
